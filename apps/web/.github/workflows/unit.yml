name: Unit Tests
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm build:packages
      - name: Run Checks
        run: pnpm run check
      - name: Run unit tests
        run: pnpm test:unit
