# This file is used to configure postgres for use with pgBadger. Normally you
# don't want to use this file to run postgres because it greately increases
# postgres logs. However, if you want some help debugging your postgres queries,
# you can use this file to run postgres and generate reports with pgBadger.
#
# To start, you'll need to install pgBadger. If you are on OSX you can use
# homebrew:
#
#   brew install pgbadger
#
# Otherwise, please read the docs to install it: https://pgbadger.darold.net/documentation.html#INSTALLATION
#
# To run postgres locally so it's compatible with pgBadger, first make sure to shut down
# your currently running dev postgres:
#
#   pnpm infra:down
#
# Now start postgres using this file:
#
#   docker-compose -f docker-compose-pgbadger.yml up
#
# Postgres logs will now be written to the `./postgres/logs` directory.
# To analyze these postgres logs with pgBadger and generate reports:
#
#   pgbadger ./postgres/logs/postgresql.log && sleep 1 && open out.html
#
# This will open a new tab in your default browser with the pgBadger report.
#
services:
  postgres:
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sort_xyz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dbadmin}
      - POSTGRES_USER=${POSTGRES_USER:-root}
    image: postgres:14
    restart: always
    ports:
      - 5432:5432
    volumes:
      - ../../packages/sort-db:/docker-entrypoint-initdb.d
      - ./postgres:/var/log/postgresql
    command:
      [
        'postgres',
        '-c',
        'logging_collector=on',
        '-c',
        'log_destination=stderr',
        '-c',
        'log_statement=all',
        '-c',
        'log_directory=/var/log/postgresql/logs',
        '-c',
        'log_filename=postgresql.log',
        '-c',
        'log_min_duration_statement=0',
        '-c',
        'log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h ',
        '-c',
        'log_checkpoints=on',
        '-c',
        'log_connections=on',
        '-c',
        'log_disconnections=on',
        '-c',
        'log_lock_waits=on',
        '-c',
        'log_temp_files=0',
        '-c',
        'log_autovacuum_min_duration=0',
        '-c',
        'log_error_verbosity=verbose',
      ]
