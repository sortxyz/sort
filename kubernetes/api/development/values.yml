# Default values for sort-api-v2.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 409563124858.dkr.ecr.us-west-2.amazonaws.com/api
  pullPolicy: IfNotPresent
  tag: f2101aa5fc97f8175d8a738105b4778b283e528a

imagePullSecrets: []
nameOverride: "sort-api-v2"
fullnameOverride: ""

serviceAccount:
  create: true
  roleArn: "arn:aws:iam::409563124858:role/us-west-2-sort-services-role"
  name: "sort-api-v2"

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  hosts:
    - host: api.development.sort.xyz
      paths:
        - path: /
          pathType: Prefix

env:
  - name: SERVICE_URL
    value: https://api.development.sort.xyz
  - name: LOG_LEVEL
    value: info
  - name: POSTGRES_HOST
    value: postgres.development.internal.sort.xyz:5432
  - name: POSTGRES_DB
    value: sort_xyz
  - name: POSTGRES_USER
    value: postgres

secretNameRef: "sort-api-secrets"

resources:
  # if you move this up, change in the Dockerfile as well
  requests:
    cpu: 400m
    memory: 400Mi
  limits:
    cpu: 1250m
    memory: 2600Mi

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 2
  timeoutSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 5
  terminationGracePeriodSeconds: 32 # a bit longer than our customer query timeout

startupProbe:
  httpGet:
    path: /health
    port: 8080
  failureThreshold: 10
  periodSeconds: 10
  timeoutSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 81

nodeSelector: {}

tolerations: []

affinity: {}
