# Default values for sort-api-v2.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 409563124858.dkr.ecr.us-west-2.amazonaws.com/api
  pullPolicy: Always
  tag: "development"

imagePullSecrets: []
nameOverride: "sort-api-v2"
fullnameOverride: ""

serviceAccount:
  create: true
  roleArn: "arn:aws:iam::409563124858:role/us-west-2-sort-services-role"
  name: "sort-api-v2"

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  hosts:
    - host: api.development.sort.xyz
      paths:
        - path: /
          pathType: Prefix

env:
  []
  # - name:
  #   value:

secrets:
  []
  # mountFromSecretsManager: true
  # awsSecretName: "sort-api-v2-secrets"
  # k8sSecretName: "sort-api-v2-secrets"
  # secretRefs:
  #   - awsSecretKey:
  #     k8sSecretName:

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  requests:
    cpu: 400m
    memory: 400Mi
  limits:
    cpu: 600m
    memory: 600Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
